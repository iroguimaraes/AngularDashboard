<div class="grid-container">
    <h1 class="mat-h1">Dashboard</h1>
    <mat-grid-list cols="2" rowHeight="350px">
        <!-- Grafico Column -->
        <mat-grid-tile [colspan]="2" [rowspan]="1">
            <mat-card class="dashboard-card">
                <mat-card-header>
                    <mat-card-title>
                        <span class="default-text-color">Colunas</span>
                    </mat-card-title>
                </mat-card-header>
                <mat-card-content class="dashboard-card-content">
                    <p-chart type="bar" height="250" [data]="columnData" [options]="columnOptions"></p-chart>
                </mat-card-content>
            </mat-card>
        </mat-grid-tile>

        <!-- Grafico Horizontal -->
        <mat-grid-tile [colspan]="1" [rowspan]="1">
            <mat-card class="dashboard-card">
                <mat-card-header>
                    <mat-card-title>
                        <span class="default-text-color">Horizontal</span>
                    </mat-card-title>
                </mat-card-header>
                <mat-card-content class="dashboard-card-content">
                    <p-chart type="bar" height="265" [data]="horizontalData" [options]="horizontalOptions"></p-chart>
                </mat-card-content>
            </mat-card>
        </mat-grid-tile>

        <!-- Grafico Pie Chart -->
        <mat-grid-tile [colspan]="1" [rowspan]="2">
            <mat-card class="dashboard-card">
                <mat-card-header>
                    <mat-card-title>
                        <span class="default-text-color">Pie</span>
                    </mat-card-title>
                </mat-card-header>
                <mat-card-content class="dashboard-card-content">
                    <p-chart type="pie" height="600" [data]="pieData" [options]="pieOptions"/>
                </mat-card-content>
            </mat-card>
        </mat-grid-tile>

        <!-- Grafico Line -->
        <mat-grid-tile [colspan]="1" [rowspan]="1">
            <mat-card class="dashboard-card">
                <mat-card-header>
                    <mat-card-title>
                        <span class="default-text-color">Line</span>
                    </mat-card-title>
                </mat-card-header>
                <mat-card-content class="dashboard-card-content">
                    <p-chart type="line" height="265" [data]="lineData" [options]="lineOptions"></p-chart>
                </mat-card-content>
            </mat-card>
        </mat-grid-tile>
    </mat-grid-list>
</div>
